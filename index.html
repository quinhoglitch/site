<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STREAMIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="nav-left">
    <div class="nav-logo" onclick="goHome()">STREAMIX</div>
    <div class="nav-links">
      <button class="nav-link active" onclick="goHome()">Inicio</button>
      <button class="nav-link" onclick="goHome()">Series</button>
      <button class="nav-link" onclick="goHome()">Continuar</button>
    </div>
  </div>
  <div class="nav-search">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar séries..." oninput="onSearch(this.value)" />
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div class="nav-right">
    <button class="btn-icon" onclick="goHome()" title="Início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <div class="net-btn-wrap">
      <button class="btn-icon btn-network" onclick="toggleNetPanel()" title="Acesso pela rede">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
      <div class="net-panel" id="netPanel" style="display:none">
        <div class="net-panel-header">
          <span>📡 Acesso pela Rede Local</span>
          <button onclick="toggleNetPanel()">✕</button>
        </div>
        <p class="net-panel-desc">Acesse de qualquer dispositivo conectado ao mesmo Wi-Fi ou rede:</p>
        <div class="net-ips" id="netIPs"><div class="net-loading">Carregando...</div></div>
        <div class="net-panel-tip">💡 Digite o endereço no navegador do outro dispositivo</div>
      </div>
    </div>
  </div>
</nav>

<main id="app">

  <!-- HOME -->
  <div id="view-home" class="view active">
    <div class="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-content">
        <p class="hero-label">EM DESTAQUE</p>
        <h1 class="hero-title" id="heroTitle">Carregando...</h1>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-actions">
          <button class="btn-play" onclick="heroPlay()">&#9654; Assistir</button>
          <button class="btn-ghost" onclick="heroPlay()">Mais detalhes</button>
        </div>
      </div>
      <div class="hero-gradient"></div>
    </div>
    <div class="section">
      <div class="section-header">
        <h2 class="section-title" id="sectionTitle">Todas as Séries</h2>
        <span class="section-count" id="sectionCount"></span>
      </div>
      <div class="grid" id="seriesGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-icon">📭</div>
        <p>Nenhuma série encontrada</p>
        <small>Adicione vídeos na pasta <code>D:\animes</code></small>
      </div>
    </div>
  </div>

  <!-- SERIES -->
  <div id="view-series" class="view">
    <div class="series-hero">
      <div class="series-hero-bg" id="seriesHeroBg"></div>
      <div class="series-hero-content">
        <button class="btn-back" onclick="goHome()">← Voltar</button>
        <h1 class="series-title" id="seriesTitle"></h1>
        <div class="series-meta" id="seriesMeta"></div>
      </div>
      <div class="hero-gradient"></div>
    </div>
    <div class="season-tabs-wrap">
      <div class="season-tabs" id="seasonTabs"></div>
    </div>
    <div class="episodes-section">
      <div class="episodes-grid" id="episodesGrid"></div>
    </div>
  </div>

  <!-- PLAYER -->
  <div id="view-player" class="view">
    <div class="player-header">
      <button class="btn-back" id="playerBack">← Voltar</button>
      <div class="player-info">
        <span class="player-series" id="playerSeries"></span>
        <span class="player-ep" id="playerEp"></span>
      </div>
    </div>

    <!-- Vídeo + legenda sobrepostas dentro deste wrapper -->
    <div class="player-container">
      <div class="video-wrapper">
        <video id="mainPlayer" controls preload="metadata"></video>
        <!-- Legenda renderizada por JS, flutua sobre o vídeo -->
        <div id="subOverlay" class="sub-overlay"></div>
      </div>

      <!-- Barra de legendas: FORA do video-wrapper, abaixo do vídeo -->
      <div id="subBar" class="sub-bar" style="display:none">
        <span class="sub-bar-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>
          Legendas:
        </span>
        <div id="subBtns" class="sub-btns"></div>
      </div>
    </div>

    <div class="player-below">
      <div class="player-title-row">
        <div>
          <h2 class="player-title" id="playerTitle"></h2>
          <p class="player-sub" id="playerSub"></p>
        </div>
        <div class="player-nav-btns">
          <button id="btnPrevEp" class="btn-ep-nav" onclick="prevEpisode()">← Anterior</button>
          <button id="btnNextEp" class="btn-ep-nav" onclick="nextEpisode()">Próximo →</button>
        </div>
      </div>
      <div class="up-next" id="upNext"></div>
    </div>
  </div>

</main>

<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-logo">STREAMIX</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
